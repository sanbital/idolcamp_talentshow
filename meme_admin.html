<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>아이돌 수련회 · 짤 장기자랑 관리자</title>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf4e5;color:#173e31;font-family:Pretendard,"Noto Sans KR",sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px 16px 60px}h1{margin:0 0 6px;font-size:27px}h2{margin:0 0 13px;font-size:18px}.muted{color:#71857a;font-size:12px;line-height:1.5}.card{background:#fff;border:2px solid rgba(15,59,58,.12);border-radius:18px;padding:18px;margin-top:15px;box-shadow:0 6px 0 rgba(15,59,58,.08)}.toolbar{display:flex;align-items:end;gap:9px;flex-wrap:wrap}.field{min-width:170px;flex:1}.field.small{min-width:130px;flex:0 1 180px}label{display:block;font-size:12px;font-weight:850;margin-bottom:6px}input,select,textarea{width:100%;border:1.5px solid #b8cbbb;border-radius:10px;padding:10px 11px;font:inherit}button{border:0;border-radius:10px;padding:10px 13px;font:inherit;font-weight:850;cursor:pointer;background:#0f3b3a;color:#fff}button.ghost{background:#eaf3de;color:#173e31}button.warn{background:#ad6200}button.danger{background:#ad263b}button:disabled{opacity:.4;cursor:default}.summary{display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));gap:9px}.stat{border-radius:13px;background:#f4f8ea;padding:13px}.stat b{display:block;font-size:24px;margin-top:4px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;min-width:1000px}th,td{text-align:left;border-bottom:1px solid #e4ece2;padding:10px 8px;vertical-align:middle}th{color:#61776a;font-size:11px;position:sticky;top:0;background:#fff}.team{display:inline-block;border-radius:999px;background:#eaf3de;padding:4px 7px;font-weight:850}.actions{display:flex;gap:5px;flex-wrap:wrap}.actions button{padding:7px 9px;font-size:11px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(15px);opacity:0;background:#0f3b3a;color:#fff;border-radius:999px;padding:11px 17px;font-weight:800;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%)}.finalist{background:#fff8d5}@media(max-width:700px){.summary{grid-template-columns:repeat(2,1fr)}.wrap{padding:16px 10px}.toolbar>*{width:100%}.field.small{min-width:0;flex:1}}
</style>
</head>
<body><div class="wrap">
  <h1>🎭 짤 장기자랑 관리자</h1><div class="muted">승인 작품만 등록 10,000점과 X 좋아요 점수가 반영됩니다. 예선 동결 후에는 좋아요 수가 변경되지 않습니다.</div>
  <section class="card"><div class="toolbar">
    <div class="field"><label>관리자 키</label><input id="adminKey" type="password" autocomplete="current-password" placeholder="SQL 설치 시 지정한 키"></div>
    <button type="button" id="saveKey">키 저장</button><button type="button" class="ghost" id="refresh">새로고침</button><button type="button" class="ghost" id="sync">X 좋아요 지금 동기화</button>
  </div></section>
  <section class="card"><h2>운영 현황</h2><div class="summary" id="summary"></div></section>
  <section class="card"><div class="toolbar">
    <div class="field small"><label>상태</label><select id="status"><option value="">전체</option><option value="pending" selected>검수 대기</option><option value="approved">승인</option><option value="rejected">반려</option><option value="unavailable">삭제·비공개</option><option value="removed">운영 삭제</option></select></div>
    <button type="button" class="ghost" id="load">목록 조회</button><button type="button" class="warn" id="freeze">8/7 예선 동결·TOP 10 확정</button>
  </div><div class="muted" style="margin-top:8px">동결은 최종 X 동기화 후 실행하세요. X 계정당 최고 순위 1작만 결선 후보가 됩니다.</div></section>
  <section class="card"><div class="table-wrap"><table><thead><tr><th>ID</th><th>팀</th><th>짤 제목</th><th>X 계정</th><th>좋아요</th><th>상태</th><th>등록</th><th>작품</th><th>처리</th></tr></thead><tbody id="rows"></tbody></table></div></section>
  <section class="card"><h2>결선 우승작 확정</h2><div class="toolbar"><div class="field small"><label>결선 작품</label><select id="winner"></select></div><button type="button" class="warn" id="setWinner">1위 확정·응원 팀 100만점 지급</button></div><div class="muted" style="margin-top:8px">중복 지급되지 않고, 우승작을 변경하면 기존 팀 보너스가 회수된 뒤 새 팀에 반영됩니다.</div></section>
</div><div class="toast" id="toast"></div>
<script>
const C=window.MUNIVERSE_CONFIG||{},S={url:C.supabaseUrl||"",key:C.supabaseAnonKey||""};
const TEAM={closeyoureyes:"CLOSE YOUR EYES",flareu:"FLARE U",idntt:"idntt",ahof:"AHOF"};
const $=s=>document.querySelector(s);function headers(){return{"Content-Type":"application/json",apikey:S.key,Authorization:`Bearer ${S.key}`}}function key(){return $("#adminKey").value.trim()}function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("show");clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove("show"),1900)}
async function rpc(name,body){const r=await fetch(`${S.url}/rest/v1/rpc/${name}`,{method:"POST",headers:headers(),body:JSON.stringify(body)}),t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.message||t||"요청 실패");return d}
async function summary(){const d=await rpc("meme_admin_summary",{p_admin_key:key()});const vals=[["검수 대기",d.pending],["승인",d.approved],["반려",d.rejected],["비공개",d.unavailable],["결선 후보",d.finalists]];$("#summary").innerHTML=vals.map(x=>`<div class="stat"><span>${x[0]}</span><b>${Number(x[1]||0).toLocaleString()}</b></div>`).join("");}
async function load(){const rows=await rpc("meme_admin_list",{p_admin_key:key(),p_status:$("#status").value||null,p_limit:300});$("#rows").innerHTML=(rows||[]).map(r=>`<tr class="${r.is_finalist?"finalist":""}"><td>${r.id}${r.finalist_rank?`<br>결선 ${r.finalist_rank}위`:""}</td><td><span class="team">${TEAM[r.team_id]||r.team_id}</span></td><td><b>${esc(r.title)}</b></td><td><a href="${esc(r.x_profile_url)}" target="_blank" rel="noopener">@${esc(r.x_username)}</a></td><td><b>${Number(r.like_count||0).toLocaleString()}</b><br><span class="muted">RP ${Number(r.repost_count||0).toLocaleString()}</span></td><td>${r.status}</td><td>${new Date(r.submitted_at).toLocaleString("ko-KR")}</td><td><a href="${esc(r.post_url)}" target="_blank" rel="noopener">X에서 확인</a></td><td><div class="actions">${r.status!=="approved"?`<button data-action="approve" data-id="${r.id}">승인</button>`:""}<button class="ghost" data-action="reject" data-id="${r.id}">반려</button><button class="danger" data-action="remove" data-id="${r.id}">삭제</button></div></td></tr>`).join("")||`<tr><td colspan="9" class="muted">대상 작품이 없습니다.</td></tr>`;document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>moderate(b.dataset.id,b.dataset.action));await loadFinalists();}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function moderate(id,action){const note=action==="approve"?"":prompt(action==="reject"?"반려 사유":"삭제 사유")||"";if(action!=="approve"&&!note)return;if(!confirm(`${id}번 작품을 ${action} 처리할까요?`))return;await rpc("meme_admin_moderate",{p_admin_key:key(),p_entry_id:Number(id),p_action:action,p_note:note,p_admin_name:"admin"});toast("처리 완료");await all();}
async function loadFinalists(){const rows=await rpc("meme_admin_list",{p_admin_key:key(),p_status:"approved",p_limit:300});const f=(rows||[]).filter(x=>x.is_finalist).sort((a,b)=>a.finalist_rank-b.finalist_rank);$("#winner").innerHTML=f.map(x=>`<option value="${x.id}">${x.finalist_rank}위 · ${TEAM[x.team_id]} · ${esc(x.title)}</option>`).join("")||`<option value="">예선 동결 후 표시됩니다</option>`;}
async function all(){await Promise.all([summary(),load()])}
$("#saveKey").onclick=()=>{localStorage.setItem("idolcamp_meme_admin_key",key());toast("저장 완료")};$("#refresh").onclick=all;$("#load").onclick=load;$("#status").onchange=load;
$("#sync").onclick=async()=>{const r=await fetch(`${S.url}/functions/v1/sync-x-likes`,{method:"POST",headers:{...headers(),"x-admin-key":key()},body:"{}"}),d=await r.json();if(!r.ok)throw new Error(d.code||"동기화 실패");toast(d.skipped?"예선 동결 상태":"X 좋아요 동기화 완료");await all()};
$("#freeze").onclick=async()=>{if(!confirm("예선 점수를 동결하고 TOP 10을 확정할까요? 실행 후 X 좋아요는 더 이상 갱신되지 않습니다."))return;await rpc("meme_admin_freeze",{p_admin_key:key(),p_admin_name:"admin"});toast("TOP 10 확정 완료");await all()};
$("#setWinner").onclick=async()=>{const id=Number($("#winner").value);if(!id)return alert("결선 작품을 선택하세요.");if(!confirm("이 작품을 최종 1위로 확정하고 응원 팀에 100만점을 반영할까요?"))return;const d=await rpc("meme_admin_set_winner",{p_admin_key:key(),p_entry_id:id,p_admin_name:"admin"});toast(`${TEAM[d.team_id]} 100만점 반영 완료`);await all()};
$("#adminKey").value=localStorage.getItem("idolcamp_meme_admin_key")||"";if(key())all().catch(e=>console.warn(e));window.addEventListener("unhandledrejection",e=>{alert(e.reason?.message||"요청 실패")});
</script></body></html>
